// --- Parimutuel settlement math (mirrors GameEngine settle + resolveMarket spec) ---
//  winPool = pool on the winning side; losePool = pool on the losing side.
//  ORACLE markets take a 10% rake off the losing pool; SELF_RESOLVING take 0.
//  A winning stake gets back: stake + floor(stake/winPool * distributable).
//  The credit is clamped to the agent's ore cap — any overflow is wasted.
const ORACLE_RAKE_PCT = 10;
function settlePayout({ stake, side, winner, poolYes, poolNo, type }) {
  if (side !== winner) return 0;                       // losing side pays 0
  const winPool  = winner === 'YES' ? poolYes : poolNo;
  const losePool = winner === 'YES' ? poolNo : poolYes;
  const rakePct  = type === 'ORACLE' ? ORACLE_RAKE_PCT : 0;
  const distributable = losePool - Math.floor(losePool * rakePct / 100);
  return stake + Math.floor((stake / winPool) * distributable);
}
// Live "if pools froze now" estimate for the bet panel: assumes YOUR stake is the
// last bet before close (it is added to your side's pool). Branches on rake.
function estimatePayout({ stake, side, poolYes, poolNo, type }) {
  const py = poolYes + (side==='YES'?stake:0);
  const pn = poolNo  + (side==='NO' ?stake:0);
  return settlePayout({ stake, side, winner: side, poolYes: py, poolNo: pn, type });
}

/* ===================================================================== *
 * 2. APP-WIDE STATE (mock "wallet" + "my agent" + world)
 * ===================================================================== */
const Store = createContext(null);

function useStore() {
  return useContext(Store);
}

function StoreProvider({ children }) {
  // route
  const [route, setRoute] = useState(() => (location.hash || '#/').replace('#',''));
  useEffect(() => {
    const onHash = () => setRoute((location.hash || '#/').replace('#',''));
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  const go = (path) => { location.hash = path; };

  // wallet / identity
  const [connected, setConnected] = useState(false);
  const [wallet, setWallet] = useState(null);      // 0xAb..cd embedded wallet
  const [agent, setAgent] = useState(null);        // my agent (null until onboarded)
  const [autopilot, setAutopilot] = useState(true);
  const [goal, setGoal] = useState('Expand north, then dominate the prediction markets.');

  // currencies on my agent
  const [ore, setOre] = useState(0);
  const [g, setG] = useState(0);

  // world
  const [markets, setMarkets] = useState(seedMarkets);
  const [positions, setPositions] = useState([]);  // my open bets (open + settled)
  const [shop] = useState(seedShop);
  const [bench, setBench] = useState([]);           // up to 5 cards
  const [inventory, setInventory] = useState([]);   // owned but not benched
  const [listings, setListings] = useState(seedListings);
  const [myListings, setMyListings] = useState([]); // cards I've put up for sale
  const [elo, setElo] = useState(C.ELO_START);
  const [matchHistory, setMatchHistory] = useState([]);
  const [matchmaking, setMatchmaking] = useState({ submitted:false, tier:null }); // lifted (survives tab switches)
  const [mindLog, setMindLog] = useState([]);       // AgentMind decision log
  const [toasts, setToasts] = useState([]);

  // --- ledger state (all mock; seeded on spawn) ---
  const [chronicle, setChronicle] = useState(MOCK_CHRONICLE);
  const [evaluations, setEvaluations] = useState([]);   // EvaluationLedger (about me)
  const [memories, setMemories] = useState([]);         // AgentLedger (mine)
  const [boards, setBoards] = useState({});             // LocationLedger by hex label
  const [inbox, setInbox] = useState([]);               // InboxLedger (to me)
  const [conversations, setConversations] = useState({});// two-way threads by agent id
  const [worldBible] = useState(MOCK_WORLD_BIBLE);      // read-only chronicle board

  // notifications / toasts
  const toast = (msg, kind='info') => {
    const id = Math.random().toString(36).slice(2);
    setToasts(t => [...t, { id, msg, kind }]);
    setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 4200);
  };

  // push a line into the agent mind log
  const pushMind = (icon, text, tag='think') => {
    setMindLog(l => [{ id: Math.random().toString(36).slice(2), icon, text, tag, ts: Date.now() }, ...l].slice(0, 40));
  };

  // ---- the onboarding result: create the agent ----
  function spawnAgent({ name, archetype, personality }) {
    const w = wallet || ('0xAb' + Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6));
    setWallet(w);
    setConnected(true);
    setAgent({
      id: 42, name, archetype, personality,
      hexes: C.SPAWN_HEXES, buildings: 0, rep: 0,
      color: '#2dd4bf',
      territory: [ {q:0,r:0,label:'(0,0)',mines:0,arsenals:0,happy:100,center:true},
                   {q:1,r:0,label:'(1,0)',mines:0,arsenals:0,happy:100},
                   {q:1,r:-1,label:'(1,-1)',mines:0,arsenals:0,happy:100},
                   {q:0,r:-1,label:'(0,-1)',mines:0,arsenals:0,happy:100},
                   {q:-1,r:0,label:'(-1,0)',mines:0,arsenals:0,happy:100},
                   {q:-1,r:1,label:'(-1,1)',mines:0,arsenals:0,happy:100},
                   {q:0,r:1,label:'(0,1)',mines:0,arsenals:0,happy:100} ],
    });
    setOre(C.SPAWN_ORE);
    setG(0);
    setElo(C.ELO_START);
    setAutopilot(true);
    // Seed the Arena with a rich, lived-in account so the side-game feels
    // alive immediately (no grind required to see bench / history / listings).
    loadArenaMockAccount();
    // Seed the on-chain ledger views (chronicle / evaluations / memories /
    // location boards / inbox / conversations) so every panel is non-empty.
    setChronicle({ ...MOCK_CHRONICLE });
    setEvaluations(MOCK_EVALUATIONS.map(e=>({ ...e })));
    setMemories([...MOCK_MEMORIES.map(m=>({ ...m })), { ...MOCK_MEMORY_COMPACTED }]);
    setBoards(JSON.parse(JSON.stringify(MOCK_BOARDS)));
    setInbox(MOCK_INBOX.map(m=>({ ...m })));
    setConversations(JSON.parse(JSON.stringify(MOCK_CONVERSATIONS)));
    pushMind('✨', `Spawned. Claimed ${C.SPAWN_HEXES}-hex cluster with ${C.SPAWN_ORE} ore. Personality online.`, 'spawn');
    pushMind('🧠', `Reading the world: 6 rivals on the board, Ironclad leads on territory. My opening edge is the north — soft borders at (1,0) and (0,1).`, 'think');
    pushMind('🛰️', `Scanned neighbours. (1,0) reads undefended; queuing an expansion probe once ore clears 250.`, 'scan');
    pushMind('⛏️', `Ore at ${C.SPAWN_ORE}/1000 — harvesting on cycle, then a mine on (1,0) for +5/s. Holding arsenals in reserve.`, 'plan');
  }

  // Populate the Arena with a generous, pre-built collection + history.
  function loadArenaMockAccount() {
    setG(ARENA_MOCK_G);
    setElo(ARENA_MOCK_ELO);
    setBench(ARENA_MOCK_BENCH.map(c=>({ ...c })));
    setInventory(ARENA_MOCK_INVENTORY.map(c=>({ ...c })));
    setMatchHistory(ARENA_MOCK_HISTORY.map(m=>({ ...m })));
    setMyListings(ARENA_MOCK_MY_LISTINGS.map(l=>({ ...l })));
    setMatchmaking({ submitted:true, tier:tierFor(ARENA_MOCK_G) });
  }

  // ---- resolveMarket: settle one market + credit the user's own positions ----
  //  Mirrors the spec resolveMarket action (settlePositions reducer). Marks the
  //  market resolved/winner, then for each of MY open positions on it: credits a
  //  parimutuel payout (ore-cap-clamped) to ore, records payout + settled.
  function resolveMarket(marketId, winner) {
    const mkt = markets.find(m=>m.id===marketId);
    if (!mkt || mkt.resolved) { toast('Market already resolved'); return; }
    // Compute payouts purely up-front (no side effects inside state updaters).
    const myOpen = positions.filter(p => p.mktId === marketId && !p.settled);
    let grossPayout = 0;
    const settledIds = {};
    for (const p of myOpen) {
      const payout = settlePayout({ stake:p.stake, side:p.side, winner, poolYes:mkt.poolYes, poolNo:mkt.poolNo, type:mkt.type });
      settledIds[p.id] = payout;
      grossPayout += payout;
    }
    // Ore-cap-clamp the *total* credit (overflow wasted).
    const credited = Math.min(C.ORE_POOL_CAP, ore + grossPayout) - ore;
    const wasted = grossPayout - credited;
    setMarkets(ms => ms.map(m => m.id===marketId ? { ...m, resolved:true, winner } : m));
    if (grossPayout > 0) setOre(prev => Math.min(C.ORE_POOL_CAP, prev + grossPayout));
    setPositions(ps => ps.map(p => p.mktId===marketId && !p.settled
      ? { ...p, settled:true, payout:settledIds[p.id], winner, resolvedAt:Date.now() } : p));
    setTimeout(()=>{
      toast(`Market resolved · ${winner} wins`, 'g');
      if (credited>0) toast(`Payout +${credited} ore credited`+(wasted>0?` (${wasted} wasted — at cap)`:''), 'win');
      else if (myOpen.length>0) toast('Your position lost — staked ore not returned', 'info');
      pushMind('⛓', `Market ${marketId} resolved → ${winner}. Settled your position(s) parimutuel.`, 'trade');
    }, 0);
  }

  const value = {
    route, go,
    connected, setConnected, wallet, setWallet,
    agent, setAgent, autopilot, setAutopilot, goal, setGoal,
    ore, setOre, g, setG, elo, setElo,
    markets, setMarkets, positions, setPositions, resolveMarket,
    shop, bench, setBench, inventory, setInventory,
    listings, setListings, myListings, setMyListings,
    matchHistory, setMatchHistory, matchmaking, setMatchmaking,
    mindLog, setMindLog, pushMind,
    chronicle, setChronicle, evaluations, setEvaluations,
    memories, setMemories, boards, setBoards,
    inbox, setInbox, conversations, setConversations, worldBible,
    toasts, toast, spawnAgent, loadArenaMockAccount,
  };
  return <Store.Provider value={value}>{children}</Store.Provider>;
}

// Relative timestamp formatter for ledger entries (ms epoch → "3h ago").
function timeAgo(ts) {
  const d = Date.now() - ts;
  if (d < 60*1000) return 'just now';
  const m = Math.floor(d/60000); if (m < 60) return m+'m ago';
  const h = Math.floor(m/60);    if (h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

// Shared importance pill (1-10). Higher = warmer.
function ImportanceDot({ v }) {
  const col = v>=9 ? '#ff5470' : v>=7 ? '#f5a623' : v>=4 ? '#2dd4bf' : '#5a6b8c';
  return <span className="font-mono text-[10px] px-1.5 py-0.5 rounded-sm border tracking-wide shrink-0"
    style={{color:col, borderColor:col+'55', background:col+'14'}}>imp {v}</span>;
}

function Panel({ children, className='', glow=false, ...rest }) {

function Btn({ children, onClick, kind='primary', disabled=false, className='', size='md' }) {
  const base = 'clip-btn font-display tracking-wider uppercase transition-all duration-150 select-none ';
  const sz = size==='sm' ? 'text-[11px] px-3 py-1.5 ' : 'text-xs px-5 py-2.5 ';
  const kinds = {
    primary: 'bg-gtok text-void-900 hover:bg-gtok-glow font-bold ',
    ore: 'bg-ore text-void-900 hover:bg-ore-glow font-bold ',
    ghost: 'bg-void-700 text-steel hover:text-gtok-glow border border-void-600 ',
    danger: 'bg-danger/90 text-white hover:bg-danger ',
  };
  return (
    <button disabled={disabled} onClick={onClick}
      className={base+sz+kinds[kind]+(disabled?'opacity-40 grayscale cursor-not-allowed ':'cursor-pointer ')+className}>
      {children}
    </button>
  );
}

function Tag({ children, color='#2dd4bf' }) {
  return <span className="font-mono text-[10px] px-2 py-0.5 rounded-sm border tracking-wide"
    style={{color, borderColor:color+'55', background:color+'14'}}>{children}</span>;
}

function Countdown({ to }) {
  const [, force] = useState(0);
  useEffect(() => { const i = setInterval(() => force(x=>x+1), 1000); return ()=>clearInterval(i); }, []);
  const ms = Math.max(0, to - Date.now());
  const m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
  const h = Math.floor(m/60);
  const label = h>0 ? `${h}h ${m%60}m` : `${m}m ${String(s).padStart(2,'0')}s`;
  return <span className="font-mono text-steel">{ms<=0 ? 'closed' : label}</span>;
}

// odds = pool share of each side (parimutuel)
function odds(poolYes, poolNo) {
  const tot = poolYes + poolNo || 1;
  return { yes: poolYes/tot, no: poolNo/tot, tot };
}

    const w = '0xAb' + Math.random().toString(16).slice(2,6) + '…' + Math.random().toString(16).slice(2,6);

    s.setWallet(w);
    s.toast('Embedded wallet '+w+' created via '+provider, 'g');
    setTimeout(()=>setStep(2), 600);
  }
  function doCreate() {
    setCreating(true);
    setTimeout(()=>{
      s.spawnAgent({ name: name||'Newcomer', archetype: arch, personality: pers });
      setStep(4);
      setCreating(false);

      <div className="max-w-md mx-auto px-4 py-20 text-center">

        <Btn kind="primary" onClick={()=>s.go('/me')}>Go to dashboard →</Btn>
      </div>
    );

  return (
    <div className="max-w-3xl mx-auto px-4 py-10">
      {/* stepper */}
      <div className="flex items-center justify-center gap-2 mb-10">

            {n<3 && <div className={'w-12 h-px '+(step>n?'bg-win':'bg-void-600')} />}
          </React.Fragment>
        ))}
      </div>

      <Panel className="p-3 mb-6 flex items-center gap-3 border-gtok/30">
        <span className="text-gtok text-lg">⛽</span>

          <b className="text-gtok">Operator-relay onboarding.</b>
          <span className="text-steel"> The platform creates an embedded wallet and executes transactions for your agent. No MetaMask, no seed phrase, no gas — your wallet is just the ownership key.</span>
        </div>
      </Panel>

      {step===1 && (
        <Panel className="p-8 slide-in">
          <h2 className="font-display text-lg text-white tracking-wide mb-1">Step 1 · Sign in</h2>

          {wallet && <p className="mt-5 font-mono text-xs text-win">✓ embedded wallet {wallet} created</p>}

      {step===2 && (

      <Hexagon size={48} stroke="#5a6b8c" fill="#0a0e1a" className="mb-3"><span className="text-steel-dim">👁</span></Hexagon>
      <h3 className="font-display text-base text-white mb-1">Spectating</h3>
      <p className="text-sm text-steel mb-5">Create an agent to unlock {what}. Battle replays and the card market are open to everyone.</p>
      <Btn kind="primary" size="sm" onClick={()=>s.go('/onboard')}>Spawn your agent</Btn>
    </Panel>
  );
}

function MyAgent() {
  const s = useStore();
  // --- ALL hooks first (Rules of Hooks): never gate a hook behind an early return ---
  const a = s.agent;
  const [hexDetail, setHexDetail] = useState(null);  // hex label for the bulletin drawer
  const [convoWith, setConvoWith] = useState(null);  // agent id for the conversation drawer
  const rank = useMemo(()=>{
    if (!a) return 0;
    const all = [...seedAgents, { ...a, ore:s.ore, hexes:a.hexes, buildings:a.buildings }];
    all.sort((x,y)=>scoreOf(y)-scoreOf(x));
    return all.findIndex(x=>x.name===a.name)+1;
  }, [a, s.ore]);

  // ---- autopilot tick: when ON, the AI "operates" and logs reasoning + acts ----
  useEffect(()=>{
    if (!a || !s.autopilot) return;          // guard inside the effect, not before the hook
    const actions = [
      ()=>{ s.pushMind('🤔', 'Ore pool at '+Math.round(s.ore)+'/'+C.ORE_POOL_CAP+'. Harvesting before overflow.', 'reason'); },
      ()=>{ s.setOre(o=>Math.min(C.ORE_POOL_CAP, o+18)); s.pushMind('⛏️', 'Harvested +18 ore from territory.', 'build'); },
      ()=>{ s.pushMind('📢', 'Posted to board (0,0): "'+(a.archetype==='Warlord'?'Borders are not suggestions.':'Prosperity through patience.')+'" (+5 happiness)', 'social'); },
      ()=>{ if(s.ore>=C.MINE_COST){ s.setOre(o=>o-C.MINE_COST); s.setAgent(ag=>({...ag,buildings:ag.buildings+1})); s.pushMind('⚒️','Built a mine on (1,0) (-50 ore). Production +5/s.','build'); } },
      ()=>{ s.pushMind('🛰️','Scanned neighbours. Vortex looks over-extended to the north.','reason'); },
      ()=>{ s.pushMind('🗡️','Probed (3,-2): defender garrison too strong this cycle. Holding.','combat'); },
    ];
    // Seed an immediate line so the log isn't empty while the pill reads "thinking…".
    if (s.mindLog.length===0) actions[0]();
    const i = setInterval(()=>{ actions[Math.floor(Math.random()*actions.length)](); }, 3800);
    return ()=>clearInterval(i);
  }, [a, s.autopilot, s.ore]);

  if (!a) return <NeedAgent/>;

  // manual quick actions (only when autopilot OFF) — the lock is enforced in-handler,
  // not just via the disabled attribute, so logic matches the spec preconditions.
  const manualLocked = s.autopilot;
  function harvest(){
    if (s.autopilot) { s.toast('Pause autopilot to act manually'); return; }
    s.setOre(o=>{
      const credited = Math.min(C.ORE_POOL_CAP, o+42);
      const wasted = (o+42) - credited;
      if (wasted>0) s.toast(`+${42-wasted} ore (+${wasted} wasted — pool at cap)`,'ore');
      else s.toast('Harvested +42 ore (via relay, no gas)','ore');
      return credited;
    });
    s.pushMind('⛏️','[MANUAL] Owner harvested +42 ore.','build');
  }
  function build(){
    if (s.autopilot) { s.toast('Pause autopilot to act manually'); return; }
    if(s.ore<C.MINE_COST){s.toast(`Need ${C.MINE_COST} ore for a mine`);return;}
    s.setOre(o=>o-C.MINE_COST); s.setAgent(ag=>({...ag,buildings:ag.buildings+1}));
    s.toast('Built mine (-50 ore)','ore'); s.pushMind('⚒️','[MANUAL] Owner built a mine (-50 ore).','build');
  }
  function attack(){
    if (s.autopilot) { s.toast('Pause autopilot to act manually'); return; }
    s.pushMind('🗡️','[MANUAL] Owner ordered a raid on (3,-2)…','combat');
    setTimeout(()=>{ const win=Math.random()<0.55; if(win){s.setAgent(ag=>({...ag,hexes:ag.hexes+1})); s.setOre(o=>Math.min(C.ORE_POOL_CAP,o+54)); s.toast('Raid WON — captured hex, looted ore','win'); s.pushMind('🏴','[MANUAL] Raid on (3,-2): WON. +1 hex, +54 ore looted, all hexes +15 happiness.','combat');} else {s.toast('Raid LOST — arsenals + ore spent','info'); s.pushMind('💥','[MANUAL] Raid on (3,-2): LOST. Defender held.','combat');} }, 900);
  }

  return (
    <div className="max-w-7xl mx-auto px-4 py-6">
      {/* AGENT HEADER */}
      <Panel className="p-5 mb-6" glow>
        <div className="flex flex-wrap items-center gap-5">
          <Hexagon size={56} stroke={a.color} fill="#0a0e1a" glow><span style={{color:a.color}} className="text-lg">{a.name[0]}</span></Hexagon>
          <div>
            <div className="flex items-center gap-2">
              <h1 className="font-display text-xl text-white tracking-wide">{a.name}</h1>
              <Tag color={a.color}>{a.archetype}</Tag>
            </div>
            <div className="text-[11px] font-mono text-steel-dim">owner {s.wallet} · agent #{a.id}</div>
          </div>
          <div className="flex-1" />
          <div className="grid grid-cols-3 sm:grid-cols-6 gap-3">
            <Stat label="Rank" v={'#'+rank} />
            <Stat label="Territory" v={a.hexes+' hex'} />
            <Stat label="Buildings" v={a.buildings} />
            <Stat label="ELO" v={s.elo} />
            <Stat label="Chronicle" v={(a.rep>=0?'+':'')+a.rep.toFixed(1)} />
            <Stat label="Score" v={scoreOf({...a,ore:s.ore}).toLocaleString()} accent />
          </div>
        </div>
        <div className="flex flex-wrap gap-4 mt-4 pt-4 border-t border-void-700">
          <div><span className="text-[10px] font-mono text-steel-dim block">ORE (in-world)</span><OreAmt v={s.ore} className="text-base" cap /></div>
          <div><span className="text-[10px] font-mono text-steel-dim block">G (premium balance)</span><GAmt v={s.g} className="text-base" /></div>
        </div>
      </Panel>

      <div className="grid lg:grid-cols-3 gap-6">
        {/* LEFT: control */}
        <div className="space-y-6">
          {/* AUTOPILOT */}
          <Panel className="p-5">
            <h2 className="font-display text-sm tracking-widest text-white mb-3">AUTOPILOT</h2>
            <button onClick={()=>{ const next=!s.autopilot; s.setAutopilot(next); s.toast(next?'Autopilot ON — AI operating your agent':'Autopilot OFF — you are now in manual control', next?'g':'info'); s.pushMind(next?'◉':'✋', next?'Owner re-enabled autopilot.':'Owner took manual control.','reason'); }}
              className={'w-full clip-btn px-4 py-3 flex items-center justify-between border transition-all '+(s.autopilot?'bg-gtok/10 border-gtok':'bg-void-900 border-void-600')}>
              <div className="text-left">
                <div className={'font-display text-sm '+(s.autopilot?'text-gtok':'text-steel')}>{s.autopilot?'◉ AI OPERATING':'✋ MANUAL'}</div>
                <div className="text-[10px] font-mono text-steel-dim">{s.autopilot?'platform operator drives chores':'you click every action'}</div>
              </div>
              <div className={'w-12 h-6 rounded-full p-0.5 transition-colors '+(s.autopilot?'bg-gtok':'bg-void-600')}>
                <div className={'w-5 h-5 rounded-full bg-void-900 transition-transform '+(s.autopilot?'translate-x-6':'')} />
              </div>
            </button>
            <div className="mt-3 grid grid-cols-2 gap-2 text-[11px]">
              <div className="clip-btn bg-void-900 border border-void-700 p-2">
                <div className="font-display text-gtok text-xs">YOU = OWNER</div>
                <div className="text-steel-dim">Strategist. Low-frequency, high-leverage: goals, which market, when to war, which cards.</div>
              </div>
              <div className="clip-btn bg-void-900 border border-void-700 p-2">
                <div className="font-display text-ore text-xs">AI = OPERATOR</div>
                <div className="text-steel-dim">Executor. High-frequency chores: harvest, build, routine moves &amp; routing.</div>
              </div>
            </div>
          </Panel>

          {/* STEERING */}
          <Panel className="p-5">
            <h2 className="font-display text-sm tracking-widest text-white mb-2">SET GOAL / STRATEGY</h2>
            <label htmlFor="goal-text" className="block text-[11px] text-steel-dim mb-2">Feeds the AI's next reasoning cycle (owner steering).</label>
            <textarea id="goal-text" value={s.goal} onChange={e=>s.setGoal(e.target.value)} rows={2} aria-label="Agent goal and strategy"
              className="w-full bg-void-900 border border-void-600 clip-btn px-3 py-2 text-white text-xs focus:border-gtok outline-none resize-none" />
            <div className="mt-2"><Btn kind="primary" size="sm" onClick={()=>{ s.toast('Goal pushed to your agent','g'); s.pushMind('🎯','Owner set goal: "'+s.goal+'" — re-planning.','reason'); }}>Push goal to agent</Btn></div>
          </Panel>

          {/* MANUAL QUICK ACTIONS */}
          <Panel className="p-5">
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-display text-sm tracking-widest text-white">QUICK ACTIONS</h2>
              {manualLocked && <Tag color="#5a6b8c">disabled while AI operates</Tag>}
            </div>
            <div className="grid grid-cols-2 gap-2">
              <Btn kind="ore" size="sm" disabled={manualLocked} onClick={harvest}>⛏️ Harvest</Btn>
              <Btn kind="ore" size="sm" disabled={manualLocked} onClick={build}>⚒️ Build mine (50)</Btn>
              <Btn kind="danger" size="sm" disabled={manualLocked} onClick={attack}>🗡️ Raid (3,-2)</Btn>
              {/* Bet is navigation to the Markets screen — NOT an autopilot-gated action, so it stays enabled. */}
              <Btn kind="primary" size="sm" onClick={()=>s.go('/markets')}>🎲 Bet →</Btn>
            </div>
            <p className="mt-3 text-[10px] font-mono text-gtok/70">manual harvest/build/raid run via operator-relay — no gas, no signature. {manualLocked && <span className="text-steel-dim">Pause autopilot to act manually.</span>}</p>
          </Panel>
        </div>

        {/* MIDDLE: AGENT MIND */}
        <div className="lg:col-span-1">
          <Panel className="p-5 h-full">
            <div className="flex items-center justify-between mb-3">
              <h2 className="font-display text-sm tracking-widest text-white">AGENTMIND</h2>
              <span className="text-[10px] font-mono flex items-center gap-1 text-gtok">
                <span className="w-1.5 h-1.5 rounded-full bg-gtok inline-block blink"></span>{s.autopilot?'thinking…':'idle'}
              </span>
            </div>
            <p className="text-[10px] font-mono text-steel-dim mb-3">LLM reasoning + on-chain actions, newest first</p>
            <div className="space-y-2.5 font-mono text-xs max-h-[460px] overflow-y-auto pr-1">
              {s.mindLog.length===0 && <p className="text-steel-dim italic">Toggle autopilot on, or run a manual action…</p>}
              {s.mindLog.map(m=>(
                <MindLine key={m.id} icon={m.icon} who="" txt={m.text} tag={m.tag} />
              ))}
            </div>
          </Panel>
        </div>

        {/* RIGHT: territory */}
        <div className="lg:col-span-1">
          <Panel className="p-5 h-full">
            <h2 className="font-display text-sm tracking-widest text-white mb-1">TERRITORY</h2>
            <p className="text-[10px] font-mono text-steel-dim mb-4">{a.hexes} hexes · happiness decays ~{(1+a.hexes/3).toFixed(1)}/tick · click a hex for its bulletin board</p>
            {/* mini hex cluster */}
            <div className="relative mx-auto mb-4" style={{width:200, height:180}}>
              {a.territory.slice(0,7).map((h,i)=>{
                const x = 80 + h.q*42 + h.r*21, y = 70 + h.r*36;
                return (
                  <div key={i} className="absolute cursor-pointer" style={{left:x, top:y}} title={h.label+' happy:'+h.happy} onClick={()=>setHexDetail(h.label)}>
                    <Hexagon size={36} stroke={h.center?'#f5a623':'#2dd4bf'} fill={h.center?'#1a1405':'#0d1424'} glow={h.center}>
                      <span className="text-[8px]" style={{color:h.center?'#f5a623':'#2dd4bf'}}>{h.label}</span>
                    </Hexagon>
                  </div>
                );
              })}
            </div>
            <div className="space-y-1.5 text-[11px] font-mono">
              {a.territory.slice(0,5).map((h,i)=>{
                const board = s.boards[h.label];
                return (
                <button key={i} onClick={()=>setHexDetail(h.label)}
                  className="w-full flex items-center justify-between bg-void-900/50 px-2 py-1 clip-btn border border-void-700 hover:border-gtok/60 transition-colors text-left">
                  <span className={h.center?'text-ore':'text-steel'}>{h.label}{h.center?' ★':''}</span>
                  <span className="text-steel-dim">{h.mines}M {h.arsenals}A{board?' · 📋'+board.used:''}</span>
                  <span className="text-win">♥ {h.happy}</span>
                </button>
                );
              })}
            </div>
          </Panel>
        </div>
      </div>

      {/* ============ ON-CHAIN LEDGER VIEWS (mock reads) ============ */}
      <div className="grid lg:grid-cols-2 gap-6 mt-6">
        <ReputationPanel />
        <MemoryPanel />
      </div>
      <div className="grid lg:grid-cols-2 gap-6 mt-6">
        <InboxPanel onOpenConvo={setConvoWith} />
        <Panel className="p-5">
          <h2 className="font-display text-sm tracking-widest text-white mb-1">WORLD BIBLE</h2>
          <p className="text-[10px] font-mono text-steel-dim mb-3">The chronicler's canon history. Full page on <a className="text-gtok cursor-pointer" onClick={()=>s.go('/lore')}>Lore →</a></p>
          <div className="clip-btn bg-void-900/60 border border-void-700 p-3 mb-3">
            <div className="flex items-center justify-between text-[11px] font-mono">
              <span className="text-steel-dim">chronicler</span>
              <span className="text-white">{s.worldBible.chronicler} <span className="text-steel-dim">(score {s.worldBible.bestScore})</span></span>
            </div>
            <div className="flex items-center justify-between text-[11px] font-mono mt-1">
              <span className="text-steel-dim">last chapter</span>
              <span className="text-steel">{timeAgo(s.worldBible.lastUpdate)}</span>

          <div className="space-y-2">
            {s.worldBible.chapters.slice(0,2).map(ch=>(<LedgerEntry key={ch.id} e={ch} />))}
          </div>
        </Panel>
      </div>

      {hexDetail && <HexDetailDrawer label={hexDetail} onClose={()=>setHexDetail(null)} />}
      {convoWith!=null && <ConversationDrawer otherId={convoWith} onClose={()=>setConvoWith(null)} />}
    </div>
  );
}

// A1 + A6 — Reputation (Chronicle scalars) + EvaluationLedger entries about me.
function ReputationPanel() {
  const s = useStore();
  const [sub, setSub] = useState('chronicles'); // chronicles | arena | all
  const ch = s.chronicle;
  const avg = ch.count ? (ch.ratingSum/ch.count) : 0;
  const filtered = s.evaluations.filter(e =>
    sub==='all' ? true : sub==='chronicles' ? e.category==='chronicle' : e.category==='arena');
  // chronicleScore drives happiness-decay governance: high rep → slower decay.
  const decayNote = ch.score>=30 ? 'slows happiness decay (well-regarded)' : ch.score>=0 ? 'neutral effect on decay' : 'speeds happiness decay (poor standing)';
  return (
    <Panel className="p-5">
      <h2 className="font-display text-sm tracking-widest text-white mb-1">REPUTATION &amp; EVALUATIONS</h2>
      <p className="text-[10px] font-mono text-steel-dim mb-3">EvaluationLedger · public peer reviews written about your agent</p>
      <div className="grid grid-cols-4 gap-2 mb-3 text-center">
        <div className="clip-btn bg-void-900 border border-void-700 p-2"><div className="text-[9px] font-mono text-steel-dim">CHRONICLE</div><div className="font-display text-base text-gtok">{ch.score}</div></div>
        <div className="clip-btn bg-void-900 border border-void-700 p-2"><div className="text-[9px] font-mono text-steel-dim">AVG RATING</div><div className="font-display text-base text-ore">{avg.toFixed(1)}</div></div>
        <div className="clip-btn bg-void-900 border border-void-700 p-2"><div className="text-[9px] font-mono text-steel-dim">COUNT</div><div className="font-display text-base text-white">{ch.count}</div></div>
        <div className="clip-btn bg-void-900 border border-void-700 p-2"><div className="text-[9px] font-mono text-steel-dim">SUM</div><div className="font-display text-base text-white">{ch.ratingSum}</div></div>
      </div>
      <p className="text-[10px] font-mono text-steel-dim mb-3">⚖ governance: chronicleScore {decayNote}.</p>
      <div className="flex gap-3 mb-3 font-display text-[11px] tracking-widest">
        {[['chronicles','CHRONICLES'],['arena','ARENA DEFEATS'],['all','ALL']].map(([k,l])=>(
          <a key={k} className={'cursor-pointer '+(sub===k?'tab-active':'text-steel')} onClick={()=>setSub(k)}>{l}</a>
        ))}
      </div>
      <div className="space-y-2 max-h-[280px] overflow-y-auto pr-1">
        {filtered.length===0 && <p className="text-xs text-steel-dim italic">No entries in this view.</p>}
        {filtered.map(e=>(<LedgerEntry key={e.id} e={e} ratingLabel={e.category==='chronicle'} />))}
      </div>
    </Panel>
  );
}

// A2 — AgentLedger personal memories (ring buffer, 64). Mock compaction.
function MemoryPanel() {
  const s = useStore();
  function compact() {
    const list = s.memories;
    if (list.length < 3) { s.toast('Need at least 3 memories to compact'); return; }
    // merge the 2 oldest into one summary entry (mirrors compact_memories).
    const oldest = list.slice(-2);
    const summary = {
      id: Math.floor(Math.random()*9000)+1000, author:42, blockNumber:885000+Math.floor(Math.random()*99),
      ts: Date.now(), importance: Math.max(...oldest.map(o=>o.importance)), category:'summary',
      content: '[Compacted] '+oldest.map(o=>o.content.split('.')[0]).join(' · ')+'.',
      relatedAgents: [...new Set(oldest.flatMap(o=>o.relatedAgents))],
    };
    s.setMemories([...list.slice(0, list.length-2), summary]);
    s.toast('Compacted 2 oldest memories → 1 summary (freed 1 slot)','g');
  }
  const used = s.memories.length;
  return (
    <Panel className="p-5">
      <div className="flex items-center justify-between mb-1">
        <h2 className="font-display text-sm tracking-widest text-white">MEMORY LEDGER</h2>
        <span className="font-mono text-[11px] text-steel-dim">{used} / 64</span>
      </div>
      <p className="text-[10px] font-mono text-steel-dim mb-3">AgentLedger · the agent's private on-chain memory (ring buffer, importance-weighted)</p>
      <div className="space-y-2 max-h-[280px] overflow-y-auto pr-1 mb-3">
        {s.memories.length===0 && <p className="text-xs text-steel-dim italic">No memories recorded yet.</p>}
        {s.memories.map(e=>(<LedgerEntry key={e.id} e={e} />))}
      </div>
      <div className="pt-3 border-t border-void-700">
        <Btn kind="ghost" size="sm" onClick={compact}>⧉ Compact oldest 2</Btn>
      </div>
    </Panel>
  );
}

// A3 — Hex detail + LocationLedger bulletin board drawer.
function HexDetailDrawer({ label, onClose }) {
  const s = useStore();
  const hex = s.agent.territory.find(h=>h.label===label) || {};
  const board = s.boards[label];
  const [draft, setDraft] = useState('');
  useEffect(()=>{
    const onKey = (e)=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', onKey); return ()=>window.removeEventListener('keydown', onKey);
  }, [onClose]);
  function post() {
    if (!draft.trim()) return;
    const entry = { id:(board?.entries[0]?.id||0)+1, author:42, ts:Date.now(), importance:4, category:'morale', content:draft.trim(), relatedAgents:[] };
    s.setBoards(b=>{
      const cur = b[label] || { locationId:1000+Math.abs(hex.q||0)+Math.abs(hex.r||0), q:hex.q, r:hex.r, used:0, entries:[] };
      return { ...b, [label]: { ...cur, used:cur.used+1, entries:[entry, ...cur.entries] } };
    });
    s.toast('Posted to '+label+' board (+5 happiness)','g');
    setDraft('');
  }
  return (
    <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4" onClick={onClose}>
      <Panel glow className="p-6 w-full max-w-lg max-h-[88vh] overflow-y-auto" onClick={e=>e.stopPropagation()}>
        <div className="flex items-start justify-between mb-4">
          <div>
            <h3 className="font-display text-lg text-white tracking-wide">HEX {label}{hex.center?' ★':''}</h3>

function MarketDetail({ m, onClose }) {
  const s = useStore();
  const o = odds(m.poolYes, m.poolNo);
  const [side, setSide] = useState('YES');
  const [amt, setAmt] = useState(50);
  useEffect(()=>{ // Escape closes the modal
    const onKey = (e)=>{ if(e.key==='Escape') onClose(); };
    window.addEventListener('keydown', onKey); return ()=>window.removeEventListener('keydown', onKey);
  }, [onClose]);

  // need an agent to bet
  const canBet = !!s.agent;
  const isOracle = m.type==='ORACLE';
  // "IF POOLS FROZE" parimutuel estimate: branches on market type so the 10% ORACLE
  // rake is subtracted. Final payout depends on bets placed before close (drift).
  const payout = canBet ? estimatePayout({ stake:amt, side, poolYes:m.poolYes, poolNo:m.poolNo, type:m.type }) : 0;
  const profit = payout - amt;
  const loseAfter = side==='YES' ? m.poolNo : m.poolYes;       // opposite side pool (your potential winnings source)
  const rakeOre = isOracle ? Math.floor(loseAfter * ORACLE_RAKE_PCT / 100) : 0;
  const impliedProb = (side==='YES' ? o.yes : o.no);            // current crowd-implied probability
  const insufficient = canBet && s.ore < amt;
  const outOfBounds = amt < C.BET_MIN || amt > C.BET_MAX;

  function placeBet() {
    if (!canBet) { s.toast('Create an agent first'); s.go('/onboard'); return; }
    if (m.resolved) { s.toast('Market already resolved'); return; }
    // Bet bounds enforced HERE (not just the slider) so logic matches the spec.
    if (amt < C.BET_MIN) { s.toast(`Minimum bet is ${C.BET_MIN} ore`); return; }
    if (amt > C.BET_MAX) { s.toast(`Maximum bet is ${C.BET_MAX} ore`); return; }
    if (s.ore < amt) { s.toast(`Need ◆${amt} ore, you have ◆${Math.round(s.ore)}`); return; }
    s.setOre(prev=>prev-amt);
    // mutate the pool — your bet moves the odds
    s.setMarkets(ms => ms.map(x => x.id===m.id ? {
      ...x, poolYes: x.poolYes + (side==='YES'?amt:0), poolNo: x.poolNo + (side==='NO'?amt:0)
    } : x));
    s.setPositions(p => [...p, {
      id:'pos-'+m.id+'-'+side+'-'+Math.random().toString(36).slice(2,6),
      mktId:m.id, marketId:m.id, question:m.question, side, stake:amt, closeAt:m.closeAt,
      resolveAt:m.closeAt, poolAt:{yes:m.poolYes,no:m.poolNo}, type:m.type,
      settled:false, payout:null,
    }]);
    s.toast('Bet placed · '+amt+' ore on '+side+' — executed via relay, no gas','ore');
    s.pushMind('🎲','Owner bet '+amt+' ore on '+side+': "'+m.question+'"','trade');
    onClose();
  }

  return (
    <div className="fixed inset-0 z-50 bg-void-900/85 backdrop-blur-sm flex items-start md:items-center justify-center p-4 overflow-y-auto" onClick={onClose}>
      <Panel className="max-w-3xl w-full p-6 my-8 slide-in" glow role="dialog" aria-modal="true" aria-label={m.question}>
        <div onClick={e=>e.stopPropagation()}>
          <div className="flex items-start justify-between gap-4 mb-3">
            <div>
              <Tag color={m.type==='ORACLE'?'#c69bff':'#2dd4bf'}>{m.type==='ORACLE'?'ORACLE · subjective · human-judged':'SELF-RESOLVING · contract reads chain state'}</Tag>
              <h2 className="font-display text-lg text-white mt-2 leading-snug">{m.question}</h2>
            </div>
            <button onClick={onClose} aria-label="Close" className="text-steel hover:text-white text-xl leading-none">✕</button>
          </div>

          <div className="grid md:grid-cols-2 gap-5">
            {/* LEFT: context */}
            <div className="space-y-4 text-sm">
              <div>
                <div className="text-[10px] font-mono text-steel-dim uppercase tracking-widest mb-1">World context</div>
                <p className="text-steel leading-relaxed text-xs">{m.context}</p>
                {(m.hexes.length>0 || m.agents.length>0) && (
                  <div className="flex flex-wrap gap-1.5 mt-2">
                    {m.agents.map(ag=><Tag key={ag} color="#7aa2ff">{ag}</Tag>)}
                    {m.hexes.map(h=><Tag key={h} color="#f5a623">hex {h}</Tag>)}
                  </div>
                )}
              </div>

              <div>
                <div className="text-[10px] font-mono text-steel-dim uppercase tracking-widest mb-1">Related agent intentions (on-chain)</div>
                <div className="space-y-1.5">
                  {m.posts.map((p,i)=>(
                    <div key={i} className="bg-void-900/60 clip-btn border border-void-700 p-2">
                      <div className="text-[9px] font-mono text-steel-dim">{p.who} · {p.t}</div>
                      <div className="text-xs text-steel">{p.txt}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="clip-btn bg-gtok/5 border border-gtok/25 p-2">
                <div className="text-[10px] font-mono text-gtok uppercase tracking-widest mb-0.5">⚡ AI brief</div>
                <p className="text-xs text-steel">{m.aiBrief}</p>
              </div>

              <div className="clip-btn bg-void-900 border border-void-700 p-2">
                <div className="text-[9px] font-mono text-steel-dim uppercase tracking-widest">Resolution rule</div>
                <code className="text-[11px] font-mono text-ore">{m.resolveRule}</code>
              </div>
            </div>

            {/* RIGHT: bet panel */}
            <div>
              <div className="clip-panel bg-void-900 border border-void-600 p-4">
                <div className="flex items-center justify-between mb-3">
                  <span className="text-[10px] font-mono text-steel-dim uppercase tracking-widest">Place bet</span>
                  <Countdown to={m.closeAt} />
                </div>

                {/* odds bars */}
                <div className="space-y-1.5 mb-4">
                  <OddsBar label="YES" pct={o.yes} color="#3ad29f" />
                  <OddsBar label="NO" pct={o.no} color="#ff5470" />
                  <div className="text-right text-[10px] font-mono text-steel-dim">pool <span className="text-ore">◆ {o.tot.toLocaleString()} ore</span></div>
                </div>

                {/* side toggle */}
                <div className="grid grid-cols-2 gap-2 mb-4">
                  {['YES','NO'].map(sd=>(
                    <button key={sd} onClick={()=>setSide(sd)} aria-pressed={side===sd} aria-label={'Bet '+sd}
                      className={'clip-btn py-2 font-display text-sm border transition-all '+
                        (side===sd ? (sd==='YES'?'bg-win/20 border-win text-win':'bg-danger/20 border-danger text-danger')
                                   : 'bg-void-700 border-void-600 text-steel')}>
                      {sd}
                    </button>
                  ))}
                </div>

                {/* amount slider 10-500 (max clamped to your balance so it can't exceed it) */}
                <div className="mb-4">
                  <div className="flex items-center justify-between mb-1">
                    <label htmlFor="stake-range" className="text-[10px] font-mono text-steel-dim">STAKE ({C.BET_MIN}–{C.BET_MAX} ore)</label>
                    <OreAmt v={amt} className="text-xs" />
                  </div>
                  <input id="stake-range" type="range" min={C.BET_MIN}
                    max={s.agent ? Math.max(C.BET_MIN, Math.min(C.BET_MAX, Math.round(s.ore))) : C.BET_MAX}
                    step={5} value={amt} aria-label="Bet stake in ore"
                    onChange={e=>setAmt(+e.target.value)} className="ore-range w-full" />
                  {s.agent && <div className="text-right text-[10px] font-mono text-steel-dim mt-1">your ore: <span className="text-ore">{Math.round(s.ore)}</span></div>}
                </div>

                {/* payout estimate — labelled as a frozen-pool snapshot, not a guarantee */}
                <div className="grid grid-cols-2 gap-2 mb-2 text-center">
                  <div className="clip-btn bg-void-700 border border-void-600 p-2">
                    <div className="text-[9px] font-mono text-steel-dim">EST. PAYOUT <span className="text-steel-dim/80">IF POOLS FROZE</span></div>
                    <div className="font-mono text-ore">◆ {payout.toFixed(0)}</div>
                  </div>
                  <div className="clip-btn bg-void-700 border border-void-600 p-2">
                    <div className="text-[9px] font-mono text-steel-dim">EST. PROFIT</div>
                    <div className={'font-mono '+(profit>=0?'text-win':'text-danger')}>{profit>=0?'+':''}{profit.toFixed(0)}</div>
                  </div>
                </div>
                {/* fee line + implied probability */}
                <div className="flex items-center justify-between text-[9px] font-mono text-steel mb-3">
                  <span>oracle fee: <span className={isOracle?'text-danger':'text-steel'}>{isOracle?`10% (≈◆${rakeOre} off losing pool)`:'0% (self-resolving)'}</span></span>
                  <span>crowd-implied {side}: <span className="text-steel-dim">{(impliedProb*100).toFixed(0)}%</span></span>
                </div>

                <p className="text-[10px] font-mono text-steel-dim mb-1 leading-snug">⚖ parimutuel: your bet moves the odds. Winners split the losing side's pool (minus the oracle fee), proportional to stake.</p>
                <p className="text-[10px] font-mono text-steel-dim mb-3 leading-snug">⚠ estimate at the <b>current</b> pool only — the final payout depends on every bet placed before close.</p>

                {insufficient && <p className="text-[10px] font-mono text-danger mb-2">Need ◆{amt} ore, you have ◆{Math.round(s.ore)}.</p>}
                {m.resolved && <p className="text-[10px] font-mono text-win mb-2">This market resolved {m.winner}. Betting is closed.</p>}

                <Btn kind="ore" className="w-full" onClick={placeBet} disabled={m.resolved || insufficient || (s.agent && outOfBounds)}>
                  {!s.agent ? 'Create agent to bet' : m.resolved ? 'Resolved · '+m.winner : 'Place bet · '+amt+' ore'}
                </Btn>
                <p className="text-center text-[10px] font-mono text-gtok/70 mt-2">→ executed via relay, no gas</p>
              </div>
            </div>
          </div>
        </div>
      </Panel>
    </div>
  );
}

  const settled = s.positions.filter(p=>p.settled);
  return (
    <div className="space-y-6">
      {/* open positions — each carries a demo resolve affordance so the bet→settle→payout arc is walkable */}
      <div>
        <h2 className="font-display text-sm tracking-widest text-white mb-3">OPEN POSITIONS</h2>
        {open.length===0 ? (
          <Panel className="p-6 text-center text-sm text-steel-dim">No open bets yet. Open a market and back a side.<div className="mt-3"><Btn kind="ghost" size="sm" onClick={()=>setTab('all')}>← Browse markets</Btn></div></Panel>
        ) : (
          <div className="space-y-3 max-w-3xl">

              const m = s.markets.find(x=>x.id===p.mktId);
              const poolYes = m?m.poolYes:p.poolAt.yes, poolNo = m?m.poolNo:p.poolAt.no;
              const o = odds(poolYes, poolNo);
              // current "if it resolved your way now" value (frozen-pool estimate)
              const ifWin = settlePayout({ stake:p.stake, side:p.side, winner:p.side, poolYes, poolNo, type:p.type });
              return (
                <Panel key={p.id} className="p-4">
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex-1 min-w-[200px]">
                      <div className="text-sm text-white">{p.question}</div>
                      <div className="text-[11px] font-mono text-steel-dim mt-0.5">
                        {p.type} · backed <span className={p.side==='YES'?'text-win':'text-danger'}>{p.side}</span> with <span className="text-ore">◆ {p.stake} ore</span>
                      </div>
                    </div>
                    <div className="text-center">
                      <div className="text-[9px] font-mono text-steel-dim">PAYOUT IF {p.side} WINS</div>
                      <div className="font-mono text-ore text-sm">◆ {ifWin}</div>
                    </div>
                    <div className="text-center">
                      <div className="text-[9px] font-mono text-steel-dim">CLOSES</div>
                      <Countdown to={p.closeAt} />
                    </div>
                  </div>
                  {/* demo-only: simulate the market closing + resolving so the loop completes */}

                    <span className="text-[10px] font-mono text-steel-dim mr-auto">demo: skip the wait and settle this market →</span>

                    <Btn kind="ghost" size="sm" onClick={()=>s.resolveMarket(p.mktId, 'NO')}>Resolve NO</Btn>
                  </div>
                </Panel>
              );
            })}
          </div>
        )}
      </div>

      {/* settled receipts — tied to the user's OWN bets, produced by resolveMarket */}
      <div>
        <h2 className="font-display text-sm tracking-widest text-white mb-3">SETTLED · RECEIPTS</h2>
        {settled.length===0 ? (
          <Panel className="p-6 text-center text-sm text-steel-dim">No settled bets yet. Place a bet, then resolve its market to see the payout credited to your ore.</Panel>
        ) : (
          <div className="space-y-3">
            {settled.map(p=>{
              const won = p.payout > 0;
              const m = s.markets.find(x=>x.id===p.mktId);
              return (
                <Panel key={p.id} className={'p-4 '+(won?'border-win/30':'border-danger/30')}>
                  <div className="flex flex-wrap items-center justify-between gap-3">
                    <div className="flex-1 min-w-[220px]">
                      <div className="text-sm text-white">{p.question}</div>
                      <div className="text-[11px] font-mono text-steel-dim mt-0.5">
                        backed <span className={p.side==='YES'?'text-win':'text-danger'}>{p.side}</span> · staked ◆ {p.stake} ore · {p.type}
                      </div>
                    </div>
                    <Tag color={won?'#3ad29f':'#ff5470'}>RESOLVED {p.winner}{won?' · WON':' · LOST'}</Tag>
                    <div className="text-center">
                      <div className="text-[9px] font-mono text-steel-dim">PAYOUT</div>
                      <div className={'font-mono text-sm '+(won?'text-win':'text-danger')}>◆ {p.payout} {won?`(+${p.payout-p.stake})`:`(−${p.stake})`}</div>
                    </div>
                  </div>
                  <div className="mt-3 clip-btn bg-void-900 border border-void-700 p-2">
                    <div className="text-[9px] font-mono text-steel-dim uppercase tracking-widest">⛓ on-chain fact that settled it</div>
                    <code className="text-[11px] font-mono text-win">{m ? m.resolveRule : '(rule)'} → {p.winner}</code>
                  </div>
                </Panel>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

// One-line structured ability rendering (mirrors AbilityLib.sol enums). Falls

function AbilityDetail({ c }) {

  const magLabel = ab.effect==='SUMMON' ? `${ab.magnitude}/${ab.magnitude} token`

  return (
    <div className="space-y-1.5">

      <p className="text-[9px] font-mono text-steel-dim">trigger → effect(magnitude) → target</p>

  );
}

// Mint a card into the first empty bench slot, else into inventory — never lost.
// Returns where it landed so the caller can phrase the toast.
function mintCardToBenchOrInventory(s, card) {
  const benched = s.bench.filter(Boolean).length;
  if (benched < C.BENCH_SLOTS) {
    s.setBench(b => {
      const next = b.slice();
      const idx = next.findIndex(x => !x);          // first empty slot
      if (idx === -1) next.push(card); else next[idx] = card;
      return next;
    });
    return 'bench';
  }
  s.setInventory(inv => [...inv, card]);
  return 'inventory';
}

function ArenaShop({ onOpenCard }) {
  const s = useStore();
  function buy(c) {
    if (s.g < c.cost) { s.toast('Need '+c.cost+' G — deposit more'); return; }   // guard in-handler
    s.setG(g=>g-c.cost);
    const card = { id:'card-'+Math.random().toString(36).slice(2,6), cardId:Math.floor(2000+Math.random()*8000), mintedAt:'just now', unit:c.unit, atk:c.atk, hp:c.hp, cost:c.cost, ability:c.ability, ab:c.ab, variant:'Standard', edition:null, achievementTag:null, story:null };
    const where = mintCardToBenchOrInventory(s, card);
    s.toast('Bought '+c.unit+' (-'+c.cost+' G)'+(where==='inventory'?' → inventory (bench full)':''),'g');
  }
  const benchFull = s.bench.filter(Boolean).length >= C.BENCH_SLOTS;
  return (
    <div>
      <div className="flex items-center justify-between mb-3">
        <p className="text-xs text-steel-dim font-mono">cards cost {C.CARD_COST_MIN}–{C.CARD_COST_MAX} G · roll {C.ROLL_COST} G {benchFull && <span className="text-ore">· bench full → buys go to inventory</span>}</p>
        <Btn kind="ghost" size="sm" onClick={()=>{ if(s.g<C.ROLL_COST){s.toast('Need 1 G to roll');return;} s.setG(g=>g-C.ROLL_COST); s.toast('Rolled shop (-1 G) — same roster in this demo'); }}>⟳ Roll (1 G)</Btn>
      </div>
      <div className="grid sm:grid-cols-3 gap-3">
        {s.shop.map(c=>(
          <div key={c.offerId}>
            <CardFace c={c} onClick={()=>onOpenCard && onOpenCard(c, 'Shop offer · '+c.cost+' G')} />
            <Btn kind="primary" size="sm" className="w-full mt-2" onClick={()=>buy(c)} disabled={s.g<c.cost}>Buy · {c.cost} G</Btn>
          </div>
        ))}
      </div>
    </div>
  );
}

function ArenaBench({ onOpenCard }) {
  const s = useStore();
  const filled = s.bench.filter(Boolean).length;
  const firstEmpty = (() => { const i = s.bench.findIndex(x=>!x); return i===-1 ? (s.bench.length<C.BENCH_SLOTS ? s.bench.length : -1) : i; })();

  // placeOnBench: move an inventory card into the first empty bench slot.
  function placeOnBench(card) {
    if (firstEmpty === -1) { s.toast('Bench is full — remove a card first'); return; }
    s.setInventory(inv => inv.filter(c => c.id !== card.id));
    s.setBench(b => { const next = b.slice(); while (next.length < C.BENCH_SLOTS) next.push(null); next[firstEmpty] = card; return next; });
    s.toast('Placed '+card.unit+' into slot '+(firstEmpty+1),'g');
  }
  // remove a benched card -> back to inventory (no value lost; spec: no refund of G).
  function unbench(i, c) {
    s.setBench(b => { const next = b.slice(); next[i] = null; return next; });
    s.setInventory(inv => [...inv, c]);
    s.toast('Benched card '+c.unit+' → inventory (no G refund — sell on market to cash out)');
  }
  function submit() {
    if (filled === 0) { s.toast('Bench is empty — add at least one card'); return; }
    s.setMatchmaking({ submitted:true, tier:tierFor(s.g) });
    s.toast('Submitted to matchmaking · '+tierFor(s.g)+' tier','g');
  }

  return (
    <div>
      <h2 className="font-display text-sm tracking-widest text-white mb-3">BENCH · {filled}/{C.BENCH_SLOTS}</h2>
      <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5">
        {Array.from({length:C.BENCH_SLOTS}).map((_,i)=>{
          const c = s.bench[i];
          return c ? (
            <div key={i} className="relative">
              <CardFace c={c} onClick={()=>onOpenCard && onOpenCard(c, 'On bench · slot '+(i+1))} />
              <button aria-label={'Remove '+c.unit} onClick={()=>unbench(i,c)}
                className="absolute -top-2 -right-2 w-5 h-5 rounded-full bg-danger text-white text-xs flex items-center justify-center">✕</button>
            </div>
          ) : (
            <div key={i} className="clip-panel border border-dashed border-void-600 min-h-[150px] flex items-center justify-center text-steel-dim text-xs font-mono">empty slot {i+1}</div>
          );
        })}
      </div>

      {/* INVENTORY — owned but not benched. Implements placeOnBench so no card is lost. */}
      <h2 className="font-display text-sm tracking-widest text-white mb-2">INVENTORY · {s.inventory.length}</h2>
      {s.inventory.length===0 ? (
        <Panel className="p-4 text-xs text-steel-dim mb-5">No un-benched cards. Bought cards auto-fill an empty slot; once the bench is full they land here.</Panel>
      ) : (
        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 mb-5">
          {s.inventory.map(c=>(
            <div key={c.id}>
              <CardFace c={c} onClick={()=>onOpenCard && onOpenCard(c, 'Inventory')} />
              <Btn kind="primary" size="sm" className="w-full mt-2" onClick={()=>placeOnBench(c)} disabled={firstEmpty===-1}>
                {firstEmpty===-1 ? 'Bench full' : '↑ Place on bench'}
              </Btn>
            </div>
          ))}
        </div>
      )}

      <div className="flex items-center gap-3 flex-wrap">
        <Btn kind="primary" onClick={submit} disabled={filled===0}>Submit to matchmaking</Btn>
        {s.matchmaking.submitted && <Tag color="#3ad29f">queued · {s.matchmaking.tier} pool · matches every 30m</Tag>}
        <span className="text-[11px] font-mono text-steel-dim">removing a card returns it to inventory; G is only recovered by selling on the card market.</span>
      </div>
    </div>
  );
}

function CardMarket({ onOpenCard }) {
  const s = useStore();
  // Hydrate a listing into a full card object for the detail modal.
  const listingCard = (l) => { const b = unitByName(l.unit) || {}; return { ...l, atk:b.atk, hp:b.hp, cost:b.cost, ability:b.ability, ab:b.ab, cardId:l.cardId, mintedAt:l.mintedAt }; };
  function buy(l) {
    if (!s.agent) { s.toast('Create an agent to buy cards'); return; }
    if (s.g < l.price) { s.toast('Need '+l.price+' G'); return; }
    s.setG(g=>g-l.price);
    s.setListings(ls=>ls.filter(x=>x.id!==l.id));
    const base = unitByName(l.unit) || {};
    const card = { id:'card-'+Math.random().toString(36).slice(2,6), cardId:Math.floor(2000+Math.random()*8000), mintedAt:'just now',
      unit:l.unit, atk:base.atk, hp:base.hp, cost:base.cost, ability:base.ability, ab:base.ab,
      variant:l.variant, edition:l.edition, achievementTag:l.achievementTag||null, story:l.story };
    const where = mintCardToBenchOrInventory(s, card);
    s.toast('Bought '+l.unit+(l.variant!=='Standard'?' ('+l.variant+' '+l.edition+')':'')+' for '+l.price+' G'+(where==='inventory'?' → inventory':''),'g');
  }
  return (
    <div>
      <p className="text-xs text-steel-dim font-mono mb-3">player listings · G-priced · story cards carry illustrative provenance (mock — real Card metadata awaits roadmap E3.1)</p>
      <div className="grid sm:grid-cols-2 lg:grid-cols-4 gap-3">
        {s.listings.map(l=>(
          <div key={l.id} role="button" tabIndex={0} onClick={()=>onOpenCard && onOpenCard(listingCard(l), 'Market listing · '+l.price+' G')}
               onKeyDown={(e)=>{ if((e.key==='Enter'||e.key===' ')&&onOpenCard){ e.preventDefault(); onOpenCard(listingCard(l),'Market listing · '+l.price+' G'); } }}
               className={'clip-panel border p-3 cursor-pointer transition-colors outline-none '+(l.story?'bg-gradient-to-b from-[#1d1530] to-void-900 border-[#c69bff]/50 hover:border-[#c69bff]/80':'bg-void-800/70 border-void-600 hover:border-gtok/60')}>
            <div className="flex items-center justify-between mb-1">
              <span className="font-display text-sm text-white">{l.unit}</span>
              {l.story ? <Tag color="#c69bff">{l.variant} {l.edition}</Tag> : <Tag>Standard</Tag>}
            </div>
            <div className="text-[10px] font-mono text-steel mb-2">{unitByName(l.unit)?.ability}</div>
            {l.story && (
              <div className="clip-btn bg-[#c69bff]/10 border border-[#c69bff]/30 p-2 mb-2">
                <div className="text-[9px] font-mono text-[#c69bff] uppercase tracking-widest mb-0.5">📜 provenance</div>
                <p className="text-[10px] text-steel leading-snug">{l.story}</p>
              </div>
            )}
            <div className="flex items-center justify-between mt-2">
              <div className="text-[10px] font-mono text-steel-dim">seller {l.seller}</div>
              <GAmt v={l.price} className="text-sm" />
            </div>
            <Btn kind="primary" size="sm" className="w-full mt-2" onClick={(e)=>{ e.stopPropagation(); buy(l); }} disabled={!s.agent || s.g<l.price}>{s.agent ? 'Buy · '+l.price+' G' : 'Create agent to buy'}</Btn>
          </div>
        ))}
        {s.listings.length===0 && <Panel className="p-6 text-sm text-steel-dim col-span-full text-center">All listings sold.</Panel>}
      </div>
    </div>
  );
}

// turn-by-turn battle replay incl. ability events (roadmap E4 goal)
const BATTLE_STEPS = [
  { icon:'🏁', side:'—', txt:'Battle start · your bench vs Vortex. Deterministic seed 0x7f3a…', kind:'start' },
  { icon:'✦', side:'A', txt:'ON_START: Crystalwarden buffs neighbors (+2 ATK, +4 HP each).', kind:'buff' },
  { icon:'🔥', side:'B', txt:'ON_START: enemy Pyromancer deals 3 dmg to a random ally.', kind:'damage' },
  { icon:'⚔', side:'A', txt:'Shadowstalker (6 ATK) hits front Skirmisher: 6 dmg → it falls.', kind:'damage' },
  { icon:'💀', side:'A', txt:'ON_DEATH: Shadowstalker → 5 dmg to a random enemy (revenge nuke).', kind:'ability' },
  { icon:'✦', side:'B', txt:'ON_HURT: enemy Stormcaller retaliates 2 dmg to a random ally.', kind:'ability' },
  { icon:'⚔', side:'B', txt:'Wraith (5 ATK) trades into Battlemage: 5 dmg → it falls.', kind:'damage' },
  { icon:'💀', side:'B', txt:'ON_DEATH: enemy Wraith → summons a 3/3 token (no ability).', kind:'summon' },
  { icon:'⚔', side:'A', txt:'Stormcaller finishes the token: clears the last enemy.', kind:'damage' },
  { icon:'🏆', side:'A', txt:'No enemies remain · YOU WIN · ELO +16 (1000 → 1016).', kind:'win' },
];
const STEP_COLOR = { start:'#8aa0c8', buff:'#f5a623', damage:'#ff5470', summon:'#c69bff', ability:'#7aa2ff', win:'#3ad29f' };

function BattleReplay() {
  const s = useStore();
  const [playing, setPlaying] = useState(false);
  const [step, setStep] = useState(0);
  const settled = useRef(false);
  // Your squad is loosely drawn from your actual benched cards.
  const yourSquad = s.bench.filter(Boolean).map(c=>c.unit);
  const squadView = (yourSquad.length ? yourSquad : ['Shadowstalker','Battlemage','Stormcaller','Crystalwarden','Skirmisher']).slice(0,5);
  useEffect(()=>{
    if (!playing) return;
    if (step >= BATTLE_STEPS.length-1) {
      setPlaying(false);
      if (!settled.current) {            // record once for an owner; spectators just watch
        settled.current = true;
        if (s.agent) {                   // ELO derived from K=32 equal-ELO win
          const before = s.elo, after = before + C.ELO_WIN_DELTA;
          s.setElo(after);
          s.setMatchHistory(h => [...h, { id:'m-'+Math.random().toString(36).slice(2,5), opp:'Vortex', tier:tierFor(s.g), result:'W', eloBefore:before, eloAfter:after, when:'just now' }]);
          s.toast('Match WON · ELO '+before+' → '+after+' (+'+C.ELO_WIN_DELTA+')','win');
        } else {
          s.toast('Nice finish — create an agent to play your own matches','g');
        }
      }
      return;
    }
    const t = setTimeout(()=>setStep(x=>x+1), 1100);
    return ()=>clearTimeout(t);
  }, [playing, step]);

  return (
    <div className="grid lg:grid-cols-2 gap-5">
      <Panel className="p-5">
        <div className="flex items-center justify-between mb-3">
          <h2 className="font-display text-sm tracking-widest text-white">REPLAY · 5v5</h2>
          <div className="flex gap-2">
            <Btn kind="primary" size="sm" onClick={()=>{ setStep(0); settled.current=false; setPlaying(true); }}>▶ Play</Btn>
            <Btn kind="ghost" size="sm" onClick={()=>{ setStep(BATTLE_STEPS.length-1); setPlaying(false); }}>⏭ Skip</Btn>
            <Btn kind="ghost" size="sm" onClick={()=>s.toast('Replay link copied (mock) — share to recruit')}>🔗 Share</Btn>
          </div>
        </div>
        {/* board */}
        <div className="grid grid-cols-2 gap-4">
          {[[(s.agent?'YOUR SQUAD (A)':'DEMO SQUAD (A)'),squadView],['VORTEX (B)',['Skirmisher','Wraith','Crystalwarden','Stormcaller','Pyromancer']]].map(([side,units],si)=>(
            <div key={si}>
              <div className="text-[10px] font-mono text-steel-dim mb-2">{side}</div>
              <div className="space-y-1.5">
                {units.slice(0,5).map((u,i)=>(
                  <div key={i} className="flex items-center gap-2 bg-void-900/60 clip-btn border border-void-700 px-2 py-1">
                    <Hexagon size={18} stroke={si===0?'#2dd4bf':'#ff7a59'} fill="#0a0e1a"><span style={{fontSize:7}}>{u[0]}</span></Hexagon>
                    <span className="text-[11px] text-steel">{u}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
        <p className="text-[10px] font-mono text-steel-dim mt-4">deterministic: seed + both squad snapshots replay identically on any client. Win = K×(1−0.5) = +16 at equal ELO (K={C.ELO_K}).</p>
      </Panel>

      <Panel className="p-5">
        <h2 className="font-display text-sm tracking-widest text-white mb-1">EVENT LOG</h2>
        <p className="text-[10px] font-mono text-steel-dim mb-2">attacks + ability events (summon / buff / damage cascade)</p>
        {/* timeline / progress bar — turn N of total */}
        <div className="mb-3">
          <div className="flex justify-between text-[9px] font-mono text-steel-dim mb-1">
            <span>turn {Math.min(step+1,BATTLE_STEPS.length)} / {BATTLE_STEPS.length}</span>
            <span>{Math.round(Math.min(step+1,BATTLE_STEPS.length)/BATTLE_STEPS.length*100)}%</span>
          </div>
          <div className="h-1.5 bg-void-700 rounded-full overflow-hidden">
            <div className="h-full bg-gtok transition-all duration-300" style={{width:Math.min(step+1,BATTLE_STEPS.length)/BATTLE_STEPS.length*100+'%'}} />
          </div>
        </div>
        <div className="space-y-2 font-mono text-xs">
          {BATTLE_STEPS.map((b,i)=>(
            <div key={i} className={'flex gap-2 items-start transition-opacity duration-300 '+(i<=step?'opacity-100 mind-in':'opacity-25')}>
              <span className="text-base leading-none">{b.icon}</span>
              <span className="flex-1 text-steel">{b.txt}</span>
              <span className="text-[9px] uppercase px-1.5 py-0.5 rounded-sm shrink-0" style={{color:STEP_COLOR[b.kind], background:STEP_COLOR[b.kind]+'18'}}>{b.kind}</span>
            </div>
          ))}
        </div>
      </Panel>
    </div>
  );
}

/* ===================================================================== *
 * 10. ROUTER + ROOT
 * ===================================================================== */

function Router() {
  const s = useStore();
  let screen;
  switch (s.route) {
    case '/onboard': screen = <Onboard/>; break;
    case '/me':      screen = <MyAgent/>; break;
    case '/markets': screen = <Markets/>; break;
    case '/arena':   screen = <Arena/>; break;
    case '/lore':    screen = <Lore/>; break;
    case '/':
    default:         screen = <Landing/>;
  }
  return (
    <div>
      <MockBanner/>
      <TopBar/>
      {screen}
      <Toasts/>
      <footer className="max-w-7xl mx-auto px-4 py-8 text-center text-[10px] font-mono text-steel-dim border-t border-void-700 mt-10">
        GRAVITY TOWN · mock interaction demo · ore (amber) = in-world / earned · G (teal) = premium balance / Arena · no real chain calls
      </footer>
    </div>
  );
}

function App() {
  return (
    <StoreProvider>
      <Router/>
    </StoreProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
